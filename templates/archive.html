<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="{{BASE}}favicon.svg">
<title>全部文章 — fatbruin</title>
<meta name="description" content="fatbruin 的全部文章索引,共 {{COUNT}} 篇。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="alternate" type="application/rss+xml" title="fatbruin" href="{{BASE}}rss.xml">
<script>(function(){var n=null;try{n=localStorage.getItem('fatbruin-night')}catch(e){}var h=new Date().getHours();if(n?n==='1':(h>=19||h<6))document.documentElement.classList.add('night')})()</script>
<link rel="stylesheet" href="{{CSS_BASE}}">
<link rel="stylesheet" href="{{CSS_POST}}">
<style>.arc-head{display:flex;align-items:center;justify-content:space-between;gap:16px}.arc-head h1{margin-bottom:0}.sort{flex:none;display:grid;place-items:center;width:26px;height:26px;padding:0;color:inherit;background:none;border:1px solid currentColor;border-radius:50%;cursor:pointer;opacity:.6}.sort svg{transition:transform .2s}.sort.asc svg{transform:scaleY(-1)}.sort:hover{opacity:1}</style></head>
<body>
<div id="scene"></div>
<div class="topbar"><div class="navl"><a class="back" href="{{BASE}}#writing">← 回到小屋</a></div><div class="brand">fat<span>bruin</span></div></div>
<main><article id="art">
<div class="arc-head"><h1>全部文章</h1><button type="button" class="sort" id="sort" aria-label="切换排序" title="最新在前"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v12M1.5 11.5 4 14l2.5-2.5"/><path d="M9 4h6M9 8h4.5M9 12h3"/></svg></button></div>
<div id="arc-list">{{ARCHIVE}}</div>
</article></main>

<script type="module" src="{{BASE}}scene2d.js"></script>
<script>
var sortBtn = document.getElementById('sort'), arcList = document.getElementById('arc-list'), newest = true;
sortBtn.addEventListener('click', function(){
  newest = !newest;
  [].slice.call(arcList.children).reverse().forEach(function(sec){
    var ul = sec.querySelector('ul');
    [].slice.call(ul.children).reverse().forEach(function(li){ ul.appendChild(li); });
    arcList.appendChild(sec);
  });
  sortBtn.classList.toggle('asc', !newest);
  sortBtn.title = newest ? '最新在前' : '最早在前';
});
addEventListener('keydown', function(e){ if (e.key === 'Escape') location.href = '{{BASE}}#writing'; });
</script>
</body></html>
