<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>fatbruin — 文章</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{
--moss:#6f8f52;--pine:#3f6640;--bark:#5a4130;--soil:#6b5033;--amber:#b07a35;--clay:#8a4f3c;
--paper:#f3ead8;--line:#cdbb9c;--ink:#2a2118;--ink-2:#6a5946;
--sans:"Noto Sans SC",-apple-system,"Helvetica Neue",sans-serif;
--disp:"Bricolage Grotesque","Noto Sans SC",sans-serif;
--serif:"Noto Serif SC",Georgia,serif;
--mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#d9cbb0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:var(--pine);text-decoration:none;text-underline-offset:4px}
a:hover{color:var(--amber);text-decoration:underline}
#scene{position:fixed;inset:0;z-index:0}
#scene canvas{display:block;width:100%;height:100%}
#scene::after{content:"";position:absolute;inset:0;background:rgba(38,28,18,.5)}

.topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 26px;background:linear-gradient(180deg,rgba(35,26,16,.55),rgba(35,26,16,0))}
.back{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:#efe4cd;padding:8px 15px;border:1px solid rgba(239,228,205,.45);border-radius:999px}
.back:hover{background:#efe4cd;color:var(--ink);text-decoration:none}
.brand{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:-.03em;color:#efe4cd}
.brand span{color:#e0a86a}

main{position:relative;z-index:10;height:100svh;padding:72px clamp(24px,7vw,110px) 28px;display:flex;justify-content:center}
article{width:100%;max-width:1040px;height:100%;overflow-y:auto;overscroll-behavior:contain;background:repeating-linear-gradient(91deg,rgba(138,101,64,.05) 0 2px,transparent 2px 8px),#faf4e7;border:1px solid var(--line);border-radius:6px;box-shadow:0 30px 80px rgba(35,24,12,.4);padding:64px 0 64px}
article>*{padding:0 clamp(26px,7vw,96px)}
.meta{display:flex;gap:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);margin:0 0 14px}
h1{font-family:var(--disp);font-size:clamp(30px,4.6vw,46px);line-height:1.18;letter-spacing:-.035em;margin:0 0 16px;font-weight:600;text-wrap:pretty}
.sum{font-family:var(--serif);font-size:18px;color:var(--ink-2);margin:0 0 34px;padding-bottom:28px;border-bottom:1px solid var(--line);text-wrap:pretty}
article p{font-family:var(--serif);font-size:17.5px;line-height:2.05;margin:0 0 24px;text-wrap:pretty}
article h2{font-family:var(--disp);font-size:20px;font-weight:600;margin:42px 0 14px}
blockquote{margin:30px clamp(26px,7vw,96px);padding:4px 0 4px 22px;border-left:3px solid var(--moss);font-family:var(--serif);font-size:16.5px;color:var(--ink-2)}
ul{margin:0 clamp(26px,7vw,96px) 26px;padding:0;list-style:none}
ul li{position:relative;font-family:var(--serif);font-size:17px;line-height:1.9;padding-left:20px;margin-bottom:8px}
ul li::before{content:"";position:absolute;left:2px;top:.78em;width:6px;height:6px;border-radius:50%;background:var(--moss)}
pre{margin:0 clamp(26px,7vw,96px) 28px;font-family:var(--mono);font-size:13.5px;line-height:1.75;color:#e6dcc4;background:#33291f;border-radius:6px;overflow-x:auto;white-space:pre;padding:18px 22px}
.pnav{display:flex;gap:14px;margin-top:52px;padding-top:26px;border-top:1px solid var(--line)}
.pnav a,.pnav span{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:13px 16px;color:var(--ink)}
.pnav a:hover{background:rgba(111,143,82,.12);border-color:var(--moss);text-decoration:none}
.pnav span{opacity:.35}
.pnav .r{text-align:right}
.pnav small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:3px}
.pnav b{display:block;font-weight:400;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
article p code,li code{font-family:var(--mono);font-size:.88em;background:rgba(138,101,64,.13);padding:1px 5px;border-radius:3px}
@media (max-width:820px){main{height:100svh;padding:64px 12px 12px}article{padding:36px 0 40px}}
</style></head>
<body>
<div id="scene"></div>
<div class="topbar"><a class="back" href="fatbruin.html#writing">← 回到岛上</a><div class="brand">fat<span>bruin</span></div></div>
<main><article id="art"></article></main>

<script src="articles.js"></script>
<script src="md.js"></script>
<script>
const i = Math.max(0, Math.min(ARTICLES.length-1, parseInt(new URLSearchParams(location.search).get('p') || '0', 10) || 0));
const a = ARTICLES[i], p = ARTICLES[i-1], n = ARTICLES[i+1];
document.title = a.t + ' — fatbruin';
const body = mdToHtml(a.md);
const card = function(d, side, label){
  return d ? '<a class="'+side+'" href="post.html?p='+(side==='r'?i+1:i-1)+'"><small>'+label+'</small><b>'+d.t+'</b></a>'
           : '<span class="'+side+'"><small>'+label+'</small><b>'+(side==='r'?'到底了':'已是最新')+'</b></span>';
};
document.getElementById('art').innerHTML =
  '<p class="meta"><span>'+a.d+'</span><span>'+a.g+'</span><span>'+(a.read||'')+'</span></p>'+
  '<h1>'+a.t+'</h1><p class="sum">'+a.s+'</p>'+body+
  '<div class="pnav">'+card(p,'l','上一篇')+card(n,'r','下一篇')+'</div>';
addEventListener('keydown', function(e){
  if (e.key === 'ArrowLeft' && p) location.href = 'post.html?p='+(i-1);
  if (e.key === 'ArrowRight' && n) location.href = 'post.html?p='+(i+1);
  if (e.key === 'Escape') location.href = 'fatbruin.html#writing';
});
</script>
<script type="module" src="island.js"></script>
</body></html>
